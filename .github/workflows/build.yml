# Builds the nano3d binary for the miner (static riscv64) on every push and pull
# request, after vet and the tests, and attaches it with its SHA-256 to a GitHub
# release when a tag v* is pushed. The release is the "download" path in FLASHING.md.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: write # to create the release on a tag
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Build nano3d for the miner
        run: |
          GOOS=linux GOARCH=riscv64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o nano3d-riscv64 ./cmd/nano3d
          sha256sum nano3d-riscv64 > nano3d-riscv64.sha256
          cat nano3d-riscv64.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: nano3d-riscv64
          path: |
            nano3d-riscv64
            nano3d-riscv64.sha256
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" nano3d-riscv64 nano3d-riscv64.sha256 --title "$GITHUB_REF_NAME" --generate-notes
